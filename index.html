<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./estilos/css/reset.css">
    <link rel="stylesheet" href="./estilos/css/index.css">
    <link rel="icon" type="image/gif" href="https://i.gifer.com/origin/b1/b15425bda53ee0ec7444ddcdedb39cc1.gif">
    <script src="./estilos/js/index.js" type="text/javascript" defer></script>
    <title>Vem Nasa</title>
</head>
<body>
    <!-- Botão do menu mobile -->
    <button class="menu-toggle" id="menu-toggle">
        ☰
    </button>
    
    <header class="cabeca">
        <div class="titulo-principal">
            <h1>Foto Astronômica do Dia - NASA</h1>
        </div>
        <div class="busca">
            <div>
                <input type="date" id="data" title="Pesquise um dia específico" placeholder="Selecione uma data">
                <button id="botao" title="Pesquisar">🔭</button>
            </div>
        </div>
    </header>
    <nav id="nav-menu">
        <a href="https://www.nasa.gov" target="_blank" rel="noopener" class="nasa-logo-container" aria-label="Site oficial da NASA">
            <img src="https://i.gifer.com/origin/b1/b15425bda53ee0ec7444ddcdedb39cc1.gif" alt="Logo animado da NASA" class="nasa-logo">
        </a>
        <ul>
            <li>
                <a href="https://www.instagram.com/raphael_b.taylor/">Social Media</a>
            </li>
            <li>
                <a href="https://www.linkedin.com/in/raphael-jose-b08091165/">WebDev</a>
            </li>
            <li>
                <a href="https://github.com/raphael-jose">PORTFOLIO</a>
            </li>
            <li>
                <a href="https://www.instagram.com/resiilia.br/">RESILIA</a>
            </li>
        </ul>
    </nav>
    <div class="container">
        <h2 id="titulo-imagem"></h2>
        <div class="apod-content">
            <div class="apod-img" id="imagem-apod">
                <div class="loading" id="loading">🚀 Carregando imagem da NASA...</div>
            </div>
            <div class="apod-description" id="descricao-apod">
                <h3>Descrição:</h3>
                <p id="texto-explicativo">Carregando descrição...</p>
                <div class="apod-info">
                    <span class="data-info" id="data-info"></span>
                    <span class="copyright-info" id="copyright-info"></span>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>Desenvolvido por <a href="https://github.com/raphael-jose" target="_blank" rel="noopener">Raphael José</a></p>
    </footer>
    
</body>
</html>
